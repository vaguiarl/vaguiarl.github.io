[package]
name = "conscious-life"
version = "0.2.0"
edition = "2024"
description = "A spatial predator-prey simulation for cooperation and graded inner mappings"
license = "MIT"

[lib]
name = "conscious_life"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "conscious-life"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
